org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Robolectric pulls androidx.test transitively for unit tests. This flag only
# affects how AGP resolves those test dependencies — the published AAR still
# has no dependencies at all, which is checked by SdkArtifactTest.
android.useAndroidX=true
android.nonTransitiveRClass=true
